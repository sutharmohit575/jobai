{% extends 'base.html' %}
{% block title %}My Profile — JobAI{% endblock %}
{% block content %}
<div class="form-section-wide">
    <div class="form-card fade-up">
        <div class="form-title">My Profile</div>
        <div class="form-subtitle">Update your personal and professional information</div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{ user.email }}" class="form-control">
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" value="{{ user.phone }}" class="form-control" placeholder="+91 98765 43210">
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" value="{{ user.location }}" class="form-control" placeholder="Bangalore, India">
                </div>
            </div>
            {% if user.is_recruiter %}
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Company</label>
                    <input type="text" name="company" value="{{ user.company }}" class="form-control" placeholder="Your company name">
                </div>
                <div class="form-group">
                    <label class="form-label">Website</label>
                    <input type="url" name="website" value="{{ user.website }}" class="form-control" placeholder="https://company.com">
                </div>
            </div>
            {% endif %}
            <div class="form-group">
                <label class="form-label">Bio</label>
                <textarea name="bio" class="form-control" rows="3" placeholder="Tell us about yourself...">{{ user.bio }}</textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Profile Photo</label>
                <input type="file" name="avatar" class="form-control" accept="image/*">
            </div>
            <div style="display:flex;gap:12px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Save Changes</button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
